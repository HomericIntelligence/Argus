# Prometheus web config, passed via --web.config.file (see docker-compose.yml).
# Enables the HTTPS server; cert files are mounted by docker-compose from certs/.
# Closes #623: this stanza previously lived in configs/prometheus.yml, where the
# scrape-config parser fatally rejects it, and --web.config.file wrongly pointed
# at the scrape config itself.
tls_server_config:
  cert_file: /etc/prometheus/tls/prometheus.crt
  key_file: /etc/prometheus/tls/prometheus.key
