global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

# TLS configuration for the Prometheus HTTPS server.
# Cert files are mounted by docker-compose from certs/.
tls_server_config:
  cert_file: /etc/prometheus/tls/prometheus.crt
  key_file: /etc/prometheus/tls/prometheus.key

scrape_configs:
  # Custom exporter: converts Agamemnon + NATS + Nestor JSON APIs to Prometheus metrics format
  # Runs as argus-exporter sidecar on port 9100
  - job_name: 'homeric-exporter'
    static_configs:
      - targets: ['argus-exporter:9100']

  # JetStream consumer: durable pull subscriber for hi.agents.> and hi.tasks.>
  # Exposes real-time event-rate and task-latency metrics on port 9101
  - job_name: 'jetstream-consumer'
    static_configs:
      - targets: ['jetstream-consumer:9101']

  # Prometheus self-monitoring (over HTTPS since tls_server_config is active)
  - job_name: 'prometheus'
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
    static_configs:
      - targets: ['localhost:9090']

  # Nomad job and allocation metrics
  - job_name: 'nomad'
    metrics_path: /v1/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['172.20.0.1:4646']

  - job_name: atlas
    static_configs:
      - targets: ['argus-dashboard:3002']
    metrics_path: /metrics

  # Alertmanager self-monitoring: exposes alert pipeline health
  # (alertmanager_alerts, alertmanager_notifications_total, etc.) on :9093/metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

# NOTE: Promtail (port 9080) is intentionally NOT scraped here. Promtail
# exposes useful self-metrics (lines ingested, target counts, push errors)
# but they cardinality-multiply per tailed file/job and we keep this
# Prometheus instance focused on the service-level signals from
# homeric-exporter and the upstreams above. If you need Promtail metrics
# during an incident, add an ad-hoc scrape via `just debug-prometheus`
# or stand up a sidecar Prometheus pointed at `promtail:9080`. Re-enable
# here only after a cardinality budget is documented in CLAUDE.md.
