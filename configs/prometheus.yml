---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

# NOTE: HTTPS for the Prometheus server is enabled via configs/prometheus-web.yml
# (mounted as /etc/prometheus/web.yml, passed as --web.config.file). Do NOT add
# tls_server_config here — it is a web-config stanza and the scrape-config
# parser fatally rejects it (closes #623).

scrape_configs:
  # Custom exporter: converts Agamemnon + NATS + Nestor JSON APIs to Prometheus metrics format
  # Runs as argus-exporter sidecar on port 9100
  - job_name: 'homeric-exporter'
    static_configs:
      - targets: ['argus-exporter:9100']

  # JetStream consumer: durable pull subscriber for hi.agents.> and hi.tasks.>
  # Exposes real-time event-rate and task-latency metrics on port 9101
  - job_name: 'jetstream-consumer'
    static_configs:
      - targets: ['jetstream-consumer:9101']

  # Prometheus self-monitoring (over HTTPS — TLS is enabled via --web.config.file)
  - job_name: 'prometheus'
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
    static_configs:
      - targets: ['localhost:9090']

  # Nomad job and allocation metrics.
  # The target host:port is provided via the NOMAD_ADDR env var, which is
  # interpolated into this file by the prometheus service entrypoint (see
  # docker-compose.yml). Default in .env.example matches the WSL2 host
  # gateway (172.20.0.1:4646). Update .env to point at the Nomad agent
  # reachable from inside the argus bridge network.
  - job_name: 'nomad'
    metrics_path: /v1/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['${NOMAD_ADDR}']

  - job_name: atlas
    static_configs:
      - targets: ['argus-dashboard:3002']
    metrics_path: /metrics
    # Atlas requires the bearer token on /metrics (see dashboard/README.md).
    # Interpolated by the prometheus entrypoint from $ATLAS_AUTH_BEARER_TOKEN
    # (minted by scripts/smoke-stack.sh; empty in dev .env means 401s).
    authorization:
      credentials: '${ATLAS_AUTH_BEARER_TOKEN}'

  # Alertmanager self-monitoring: exposes alert pipeline health
  # (alertmanager_alerts, alertmanager_notifications_total, etc.) on :9093/metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

# NOTE: Promtail (port 9080) is intentionally NOT scraped here. Promtail
# exposes useful self-metrics (lines ingested, target counts, push errors)
# but they cardinality-multiply per tailed file/job and we keep this
# Prometheus instance focused on the service-level signals from
# homeric-exporter and the upstreams above. If you need Promtail metrics
# during an incident, add an ad-hoc scrape via `just debug-prometheus`
# or stand up a sidecar Prometheus pointed at `promtail:9080`. Re-enable
# here only after a cardinality budget is documented in AGENTS.md.
