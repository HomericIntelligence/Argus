---
# Issue #209: authentication required. With auth_enabled true, Loki rejects
# credential-less requests; the basic-auth username becomes the tenant ID
# (/ready and /metrics stay reachable for healthchecks).
# Rollback: revert this flag to false to restore anonymous access.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  http_tls_config:
    cert_file: /etc/loki/tls/loki.crt
    key_file: /etc/loki/tls/loki.key

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h

analytics:
  reporting_enabled: false
