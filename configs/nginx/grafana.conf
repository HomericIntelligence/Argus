# Basic-auth proxy in front of Grafana (mirrors loki.conf).
#
# Listens on plain HTTP :80 inside the container, published to the host as
# 127.0.0.1:${GRAFANA_PORT:-3001}:80 (loopback only). Grafana itself serves
# HTTPS internally, so the upstream hop is https with certificate
# verification disabled (the cert is our self-signed CA; the loopback-only
# host binding is the trust boundary).
server {
    listen 80;
    location / {
        auth_basic "Grafana";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass https://grafana:3000;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
