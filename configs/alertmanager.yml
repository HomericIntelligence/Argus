global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # ${ALERTMANAGER_DEFAULT_RECEIVER} is rendered at container start by the
  # alertmanager entrypoint in docker-compose.yml: 'slack' when
  # SLACK_WEBHOOK_URL is set in .env, else 'null' (alerts logged only).
  receiver: '${ALERTMANAGER_DEFAULT_RECEIVER}'

receivers:
  - name: 'null'

  - name: 'slack'
    slack_configs:
      # ${SLACK_WEBHOOK_URL} / ${SLACK_CHANNEL} are rendered at container
      # start from .env via the alertmanager entrypoint in docker-compose.yml.
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_CHANNEL}'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} [{{ .Status }}]'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} {{ .CommonAnnotationsString }}{{ end }}'

  # Uncomment and configure to enable email notifications:
  # - name: 'email'
  #   email_configs:
  #     - to: 'oncall@example.com'
  #       from: 'alertmanager@example.com'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alertmanager@example.com'
  #       auth_password: 'your-smtp-password'
  #       send_resolved: true
