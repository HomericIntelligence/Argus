---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: https://loki:3100/loki/api/v1/push
    tls_config:
      ca_file: /etc/promtail/tls/ca.crt

scrape_configs:
  # Tail syslog for host-level events (available in WSL2)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: ${PROMTAIL_HOST_LABEL:-${HOSTNAME}}
          __path__: /var/log/syslog
    pipeline_stages:
      - replace:
          expression: '(?i)(bearer\s+)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(token[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(key[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(secret[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(password[=:]\s*)\S+'
          replace: '${1}<redacted>'
      # URL-embedded credentials: scheme://user:password@host -> scheme://<redacted>@host
      - replace:
          expression: '([a-zA-Z][a-zA-Z0-9+.\-]*://)[^\s/@:]+:[^\s/@]+@'
          replace: '${1}<redacted>@'
      # Query-string API keys / tokens / secrets / passwords:
      # ?api_key=abc, &access_token=xyz, &client_secret=..., &password=...
      - replace:
          # yamllint disable-line rule:line-length
          expression: '(?i)([?&](?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|secret|token|password|key)=)[^&\s#]+'
          replace: '${1}<redacted>'

  # Tail Hermes application log
  - job_name: hermes
    static_configs:
      - targets:
          - localhost
        labels:
          job: hermes
          host: ${PROMTAIL_HOST_LABEL:-${HOSTNAME}}
          service: project-hermes
          __path__: /logs/hermes.log
    pipeline_stages:
      - replace:
          expression: '(?i)(bearer\s+)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(token[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(key[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(secret[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(password[=:]\s*)\S+'
          replace: '${1}<redacted>'
      # URL-embedded credentials: scheme://user:password@host -> scheme://<redacted>@host
      - replace:
          expression: '([a-zA-Z][a-zA-Z0-9+.\-]*://)[^\s/@:]+:[^\s/@]+@'
          replace: '${1}<redacted>@'
      # Query-string API keys / tokens / secrets / passwords:
      # ?api_key=abc, &access_token=xyz, &client_secret=..., &password=...
      - replace:
          # yamllint disable-line rule:line-length
          expression: '(?i)([?&](?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|secret|token|password|key)=)[^&\s#]+'
          replace: '${1}<redacted>'

  # Tail NATS server log
  - job_name: nats
    static_configs:
      - targets:
          - localhost
        labels:
          job: nats
          host: ${PROMTAIL_HOST_LABEL:-${HOSTNAME}}
          service: nats-server
          __path__: /logs/nats/nats.log
    pipeline_stages:
      - replace:
          expression: '(?i)(bearer\s+)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(token[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(key[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(secret[=:]\s*)[A-Za-z0-9._\-]+'
          replace: '${1}<redacted>'
      - replace:
          expression: '(?i)(password[=:]\s*)\S+'
          replace: '${1}<redacted>'
      # URL-embedded credentials: scheme://user:password@host -> scheme://<redacted>@host
      - replace:
          expression: '([a-zA-Z][a-zA-Z0-9+.\-]*://)[^\s/@:]+:[^\s/@]+@'
          replace: '${1}<redacted>@'
      # Query-string API keys / tokens / secrets / passwords:
      # ?api_key=abc, &access_token=xyz, &client_secret=..., &password=...
      - replace:
          # yamllint disable-line rule:line-length
          expression: '(?i)([?&](?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|secret|token|password|key)=)[^&\s#]+'
          replace: '${1}<redacted>'
