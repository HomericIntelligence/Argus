[workspace]
name = "project-argus"
version = "0.2.0"
description = "Observability stack for the HomericIntelligence mesh"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
just = ">=1.13,<2"
yamllint = ">=1.35,<2"
ruff = ">=0.4,<1"
bandit = ">=1.7,<2"
pyyaml = ">=6.0,<7"
pytest = ">=8.0"
pytest-cov = ">=5.0,<8"
python = ">=3.13,<3.14"

[target.linux-64.dependencies]
jq = ">=1.6,<2"

[target.osx-arm64.dependencies]
jq = ">=1.6,<2"

[target.osx-64.dependencies]
jq = ">=1.6,<2"

[tasks]
start     = "just start"
stop      = "just stop"
status    = "just status"
test      = "python -m pytest tests/ -v"
test-unit = "python -m pytest tests/ -v --cov=exporter --cov-report=term-missing --cov-report=xml"
test-smoke = "bash scripts/smoke-stack.sh"

[feature.lint.dependencies]
python = ">=3.13,<3.14"

[feature.lint.pypi-dependencies]
pip-audit = ">=2.8"
idna = ">=3.15"
pip = ">=26.1.2"
msgpack = ">=1.2.1"

[feature.lint.tasks]
pip-audit = "pip-audit"

[environments]
lint = { features = ["lint"], no-default-feature = true }
