[project]
name = "project-argus"
version = "0.2.0"
description = "Observability stack for the HomericIntelligence mesh"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
just = ">=1.13,<2"
yamllint = ">=1.35,<2"
ruff = ">=0.4,<1"
bandit = ">=1.7,<2"
pyyaml = ">=6.0,<7"
pytest = ">=8.0"
pytest-cov = ">=5.0"
python = ">=3.11,<3.14"

[target.linux-64.dependencies]
jq = ">=1.6,<2"

[target.osx-arm64.dependencies]
jq = ">=1.6,<2"

[target.osx-64.dependencies]
jq = ">=1.6,<2"
python = ">=3.11"
pytest = ">=7.0"

[tasks]
start     = "just start"
stop      = "just stop"
status    = "just status"
test-unit = "pytest tests/ -v"
