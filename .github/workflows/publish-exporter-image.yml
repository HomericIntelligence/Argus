name: Publish Exporter Image

# Builds and pushes the argus-exporter container to GHCR so deployments can
# reference a versioned image instead of building from local source on every
# `docker compose up`. Publishes :latest, :sha-<sha>, and the semver tag from
# exporter/VERSION (Refs #149, #393).

on:
  push:
    branches:
      - main
    paths:
      - "exporter/**"
      - ".github/workflows/publish-exporter-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push argus-exporter to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase owner segments, so lower-case the repo owner.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/argus-exporter" >> "$GITHUB_OUTPUT"

      # exporter/VERSION is the single source of truth for the semver tag;
      # scripts/check-exporter-image-version.py keeps it in sync with the
      # docker-compose.yml pin (Refs #393).
      - name: Read exporter version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < exporter/VERSION)"
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::exporter/VERSION is not strict semver: '${VERSION}'"
            exit 1
          }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Fail closed when the semver tag already exists — a stale
      # exporter/VERSION would otherwise silently overwrite a published tag.
      - name: Guard against duplicate version tag
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          EXPORTER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "${IMAGE_NAME}:v${EXPORTER_VERSION}" > /dev/null 2>&1; then
            echo "::error::tag v${EXPORTER_VERSION} already exists on GHCR — bump exporter/VERSION first"
            exit 1
          fi

      - name: Build & push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: exporter
          file: exporter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
