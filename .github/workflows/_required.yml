name: Required Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: pip install yamllint && yamllint -c .yamllint.yaml .

      - name: Validate JSON files
        run: |
          echo "::notice::Config-only repo; no source typecheck — validating JSON files instead"
          JSON_FILES=$(find . -path './.git' -prune -o -name "*.json" -print | grep "\.json$" || true)
          if [ -n "$JSON_FILES" ]; then
            FAILED=0
            while IFS= read -r f; do
              if jq . "$f" > /dev/null 2>&1; then
                echo "OK: $f"
              else
                echo "INVALID JSON: $f"
                FAILED=1
              fi
            done <<< "$JSON_FILES"
            if [ "$FAILED" -eq 1 ]; then
              echo "FAIL: one or more JSON files are invalid"
              exit 1
            fi
            echo "OK: all JSON files are valid"
          else
            echo "No JSON files found — nothing to validate"
          fi

      - name: Skip Go gosec if no Go module
        id: gosec-detect
        run: |
          if [ ! -f dashboard/go.mod ]; then
            echo "::notice::No dashboard/go.mod, skipping gosec"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go (for gosec)
        if: steps.gosec-detect.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      # gosec runs as a step inside the `lint` job per the org's policy of
      # uniform required-check names. Failure of this step fails the `lint`
      # required check; no separate `security/gosec` check name is exposed.
      # golangci-lint also enables the `gosec` linter (see
      # dashboard/.golangci.yml) for fast developer-loop feedback inside
      # `Atlas dashboard (Go)`; this step is the authoritative gate.
      - name: Run gosec
        if: steps.gosec-detect.outputs.skip == 'false'
        uses: securego/gosec@4a3bd8af174872c778439083ded7adbf3747e770  # v2.26.1
        with:
          args: ./dashboard/...

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd  # v20.0.0
        with:
          globs: "**/*.md"
          config: ".markdownlint.yaml"

  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Skip if no pixi.toml
        id: detect
        run: |
          if [ ! -f pixi.toml ]; then
            echo "::notice::No pixi.toml in repo, skipping pixi-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pixi
        if: steps.detect.outputs.skip == 'false'
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.67.2
          cache: true
      - name: pixi install (locked)
        if: steps.detect.outputs.skip == 'false'
        run: |
          if [ -f pixi.lock ]; then
            pixi install --locked
          else
            echo "::warning::pixi.toml present but pixi.lock missing — running unlocked"
            pixi install
          fi

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Validate all YAML config files
        env:
          GF_ADMIN_PASSWORD: ci-validation-only
        run: |
          pip install yamllint
          # Validate Prometheus alert rules via promtool if rules/ directory exists.
          # Only scan files under rules/ — running `promtool check rules` against
          # non-rule YAML (workflows, compose) reports false errors.
          if command -v promtool &>/dev/null && [ -d rules ]; then
            mapfile -t rule_files < <(find rules -type f \( -name "*.yml" -o -name "*.yaml" \))
            if [ "${#rule_files[@]}" -gt 0 ]; then
              promtool check rules "${rule_files[@]}"
            fi
          fi
          # Validate docker-compose YAML
          if [ -f docker-compose.yml ]; then
            docker compose config --quiet
          fi
          # Validate all YAML files with yamllint (the canonical config-repo unit test)
          find . -path './.git' -prune -o \( -name "*.yml" -o -name "*.yaml" \) -print | xargs yamllint -c .yamllint.yaml
      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: ~/.pixi
          key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-${{ runner.os }}-
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.67.2
          cache: false
      - name: pixi install (locked)
        run: |
          if [ -f pixi.lock ]; then
            pixi install --locked
          else
            echo "::warning::pixi.toml present but pixi.lock missing — running unlocked"
            pixi install
          fi
      - name: Run pytest
        run: pixi run pytest tests/ -v

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Validate docker image name formats
        run: |
          python3 - <<'EOF'
          import subprocess, re, sys

          result = subprocess.run(
              ["grep", "-rh", "image:", "--include=docker-compose*.yml", "--include=docker-compose*.yaml", "."],
              capture_output=True, text=True
          )
          lines = result.stdout.strip().splitlines()

          images = []
          for line in lines:
              parts = line.strip().split()
              if len(parts) >= 2:
                  images.append(parts[-1])

          if not images:
              print("No docker-compose image references found — skipping format validation")
              sys.exit(0)

          # Valid image pattern: [registry/][org/]name[:tag][@digest]
          # Disallow bare unqualified names without at minimum a colon-tag or slash
          valid_pattern = re.compile(
              r'^([a-z0-9][a-z0-9._\-]*(:[0-9]+)?/)?'   # optional registry
              r'([a-z0-9][a-z0-9._\-]*/)*'               # optional org path
              r'[a-z0-9][a-z0-9._\-]*'                   # image name
              r'(:[a-zA-Z0-9][a-zA-Z0-9._\-]*)?'         # optional tag
              r'(@sha256:[a-fA-F0-9]{64})?$'              # optional digest
          )

          failed = []
          for img in sorted(set(images)):
              if not valid_pattern.match(img):
                  failed.append(img)
                  print(f"INVALID image reference format: {img}")
              else:
                  print(f"OK: {img}")

          if failed:
              print(f"\nFAIL: {len(failed)} image reference(s) have invalid format")
              sys.exit(1)
          else:
              print(f"\nOK: all {len(images)} image reference(s) have valid format")
          EOF

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 0

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        # `--exit-code 0` already makes gitleaks always succeed when it
        # finds leaks; the SARIF report is uploaded for review instead.
        # No `continue-on-error` opt-out is needed — the step is wired
        # so true command failures (e.g. gitleaks crash, missing binary)
        # still fail the job, per HomericIntelligence/Odysseus#280.
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          else
            gitleaks detect --source . \
              --report-format sarif --report-path gitleaks.sarif --exit-code 0
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 90

  config-validate:
    name: config-validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Validate HCL files or fall back to YAML validation
        run: |
          pip install yamllint
          HCL_FILES=$(find . -path './.git' -prune -o -name "*.hcl" -print | grep "\.hcl$" || true)
          if [ -n "$HCL_FILES" ]; then
            if command -v nomad &>/dev/null; then
              echo "$HCL_FILES" | xargs -I{} nomad job validate {}
            elif command -v hclfmt &>/dev/null; then
              echo "$HCL_FILES" | xargs -I{} hclfmt --check {}
            else
              echo "::notice::HCL files found but no nomad/hclfmt available; falling back to YAML validation"
              yamllint -c .yamllint.yaml .
            fi
          else
            echo "::notice::No HCL files found; validating YAML configs"
            yamllint -c .yamllint.yaml .
          fi

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Validate workflow YAML files against GitHub Actions schema
        run: |
          pip install check-jsonschema
          check-jsonschema \
            --schemafile https://json.schemastore.org/github-workflow \
            .github/workflows/*.yml

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Ensure no :latest image tags in compose files
        run: |
          LATEST_HITS=$(grep -rh "image:" . --include="*.yml" --include="*.yaml" \
            --exclude-dir=".git" --exclude-dir=".github" | grep ":latest" || true)
          if [ -n "$LATEST_HITS" ]; then
            echo "FAIL: found :latest image tags — pin all images to explicit versions:"
            echo "$LATEST_HITS"
            exit 1
          else
            echo "OK: no :latest image tags found"
          fi

  atlas-dashboard:
    name: atlas/dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: go vet
        working-directory: dashboard
        run: go vet ./...
      - name: go test
        working-directory: dashboard
        run: go test ./internal/nats/...
