name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi install

      - name: Validate tag matches pixi.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pixi run python3 - <<'EOF'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG"]
          expected_version = tag.lstrip("v")

          with open("pixi.toml", "rb") as f:
              data = tomllib.load(f)

          section = data.get("workspace") or data.get("project")
          if section is None:
              print("ERROR: pixi.toml has neither [workspace] nor [project] section", file=sys.stderr)
              sys.exit(1)

          actual_version = section["version"]
          if actual_version != expected_version:
              print(
                  f"ERROR: Tag {tag!r} does not match pixi.toml version {actual_version!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"OK: tag {tag} matches pixi.toml version {actual_version}")
          EOF

      # Package the deployable exporter source (stdlib-only single-file code +
      # its container build recipe) into a versioned tarball with a checksum.
      # Staging under a versioned top-level directory keeps extraction tidy.
      - name: Package exporter artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "dist/argus-exporter-$TAG"
          cp exporter/exporter.py exporter/Dockerfile "dist/argus-exporter-$TAG/"
          tar -czf "dist/argus-exporter-$TAG.tar.gz" -C dist "argus-exporter-$TAG"
          # Generate the checksum from inside dist/ so the file records bare
          # filenames — `sha256sum -c` works in any flat download directory.
          (
            cd dist
            sha256sum "argus-exporter-$TAG.tar.gz" > "argus-exporter-$TAG.tar.gz.sha256"
          )

      - name: Create GitHub Release & upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            --title "Release $TAG"
          gh release upload "$TAG" \
            "dist/argus-exporter-$TAG.tar.gz" \
            "dist/argus-exporter-$TAG.tar.gz.sha256" \
            --clobber

  publish-atlas-image:
    name: Build & push Atlas image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The release tag is the source of truth for the image tag. github.ref_name
      # carries it on tag pushes.
      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the owner segment because GHCR rejects uppercase
      # (HomericIntelligence → homericintelligence).
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/atlas" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: dashboard
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Two tags published per release: the explicit semver tag and
          # `latest`. Operators can pin to a version or follow the channel.
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
