name: CI

# merge_group is intentionally absent from `on`: the merge queue runs only the
# fast merge-queue-smoke.yml workflow (single merge-queue-smoke job, <5 min).
on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.70.2
          cache: true

      - name: Install dependencies
        run: pixi install

      - name: Lint all YAML files
        run: |
          pixi run yamllint -d "{extends: default, rules: {line-length: {max: 120}, truthy: disable}}" \
            configs/prometheus.yml \
            configs/loki.yml \
            configs/promtail.yml \
            configs/grafana/datasources.yml \
            configs/grafana/dashboards.yml \
            rules/agent-alerts.yml \
            rules/atlas-alerts.yml \
            docker-compose.yml

      - name: Validate Promtail config syntax
        run: |
          # Run promtail -check-syntax against the committed config inside
          # the same image used by the compose stack. The config references
          # env vars; promtail expands them at parse time when
          # -config.expand-env=true, with missing vars resolving to an empty
          # string — fine for a syntax-only check.
          docker run --rm \
            -v "$PWD/configs/promtail.yml:/etc/promtail/promtail.yml:ro" \
            grafana/promtail:3.1.2 \
            -config.file=/etc/promtail/promtail.yml \
            -config.expand-env=true \
            -check-syntax

      - name: Validate Grafana dashboard JSON
        run: |
          for f in dashboards/*.json; do
            echo "Validating $f ..."
            python3 - "$f" <<'EOF'
          import json, sys
          with open(sys.argv[1]) as fh:
              d = json.load(fh)
          required = {"title", "uid", "panels"}
          missing = required - d.keys()
          if missing:
              print(f"ERROR: {sys.argv[1]} missing fields: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"  OK: uid={d['uid']!r}, title={d['title']!r}, panels={len(d['panels'])}")
          EOF
          done

      - name: Check docker-compose config
        run: docker compose config --quiet
        env:
          GF_ADMIN_PASSWORD: ci-validation-only

      - name: Check .env.example documents every compose variable
        run: bash scripts/check-env-example.sh

      - name: Check AGENTS.md documents every .env.example variable
        run: bash scripts/check-env-docs.sh

      - name: Lint exporter Python
        run: pixi run ruff check exporter/exporter.py

      - name: Security scan exporter Python
        run: |
          # bandit exits non-zero when it finds issues; we want to capture
          # the JSON report unconditionally and let the Python check below
          # decide pass/fail based on severity. Use an explicit exit-code
          # check instead of suppressing all failures with `|| true`.
          set +e
          pixi run bandit -ll -f json exporter/exporter.py > /tmp/bandit.json
          bandit_rc=$?
          set -e
          # bandit exit codes: 0=clean, 1=issues found. Anything else is
          # an unexpected error (e.g. parsing failure) and should fail.
          if [ "$bandit_rc" -ne 0 ] && [ "$bandit_rc" -ne 1 ]; then
              echo "::error::bandit exited with unexpected code $bandit_rc"
              exit "$bandit_rc"
          fi
          python3 << 'SCAN_CHECK'
          import json, sys
          with open('/tmp/bandit.json') as f:
              report = json.load(f)
          high_issues = [r for r in report.get('results', []) if r.get('severity') == 'HIGH']
          if high_issues:
              print(f"FAILURE: Found {len(high_issues)} HIGH severity issues")
              for issue in high_issues:
                  print(f"  {issue.get('issue_text')} at line {issue.get('line_number')}")
              sys.exit(1)
          print("SUCCESS: No HIGH severity security issues found")
          SCAN_CHECK

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

      - name: Assert htpasswd is not tracked
        # Guard against accidental re-addition of nginx basic-auth credentials
        # to the index (see issue #229, follow-up from #101). Matches the
        # canonical path plus any file named `htpasswd` or `*.htpasswd`.
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'configs/nginx/htpasswd' '**/htpasswd' 'htpasswd' '*.htpasswd' '**/*.htpasswd')
          if [ -n "$tracked" ]; then
            echo "::error::htpasswd file(s) found in the git index:"
            echo "$tracked"
            echo "These must not be committed. Remove with: git rm --cached <path>"
            exit 1
          fi
          echo "OK: no htpasswd files tracked"

  unit-tests:
    name: Python unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi install

      - name: Run tests with coverage
        run: pixi run test-unit

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  atlas-dashboard:
    name: Atlas dashboard (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: go build
        working-directory: dashboard
        run: go build ./...

      - name: go vet
        working-directory: dashboard
        run: go vet ./...

      - name: go test (unit, race-detected, coverage)
        working-directory: dashboard
        run: |
          go test -race -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Docker build (verify Dockerfile is buildable)
        working-directory: dashboard
        run: docker build -t argus-dashboard:ci .

  test:
    name: Test exporter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest pytest-cov pyyaml

      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check exporter/ tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -ll --skip B310,B202 -r exporter/

  # ---------------------------------------------------------------------------
  # Canonical 8-category CI naming (Odysseus ecosystem board).
  # See HomericIntelligence/Odysseus docs/ci-naming-convention.md. Each job
  # below emits a canonical check-run `name:` so the board can target it.
  # Argus is bilingual (Python exporter/consumer + Go `atlas` dashboard);
  # build/package/install cover both languages where a distributable exists.
  # ---------------------------------------------------------------------------

  # build — compiles all project artifacts (Go dashboard + Python sources).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: Build Go dashboard (atlas)
        working-directory: dashboard
        run: go build ./...

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Byte-compile Python sources (exporter + jetstream-consumer)
        run: |
          set -euo pipefail
          python -m py_compile exporter/exporter.py jetstream-consumer/consumer.py
          echo "OK: Python sources compile"

  # test (aggregate) — gate that succeeds only when the test suites pass.
  # Sub-checks (Python unit tests + coverage, Test exporter, Atlas dashboard
  # (Go), integration-tests in _required.yml) are kept as their own checks.
  test-aggregate:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, test, atlas-dashboard]

    steps:
      - name: Aggregate test result
        run: |
          echo "OK: in-workflow test suites passed (unit-tests, Test exporter, Atlas dashboard (Go))"

  # package — builds the distributable. Argus's clean distributable is the Go
  # `atlas` binary (built with the release-injected version). The Python
  # exporter/consumer ship as container images (see publish-*-image.yml) and
  # have no wheel/sdist target — tracked as a gap issue.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: Build atlas binary (release-style, version-injected)
        working-directory: dashboard
        run: |
          set -euo pipefail
          VERSION="ci-$(git rev-parse --short HEAD)"
          go build \
            -ldflags "-X github.com/HomericIntelligence/atlas/internal/version.Version=${VERSION}" \
            -o dist/argus-dashboard ./cmd/argus-dashboard
          ls -l dist/argus-dashboard

      - name: Package binary into release archive
        working-directory: dashboard
        run: |
          set -euo pipefail
          tar -czf argus-dashboard.tar.gz -C dist argus-dashboard
          ls -l argus-dashboard.tar.gz
          echo "OK: release archive built"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: argus-dashboard-archive
          path: dashboard/argus-dashboard.tar.gz
          retention-days: 14

  # install — verifies a clean install of the built artifact works.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: go install atlas binary
        working-directory: dashboard
        run: go install ./cmd/argus-dashboard

      - name: Smoke-test installed binary
        run: |
          set -euo pipefail
          BIN="$(go env GOPATH)/bin/argus-dashboard"
          if [ ! -x "$BIN" ]; then
            echo "::error::installed binary not found or not executable at $BIN"
            exit 1
          fi
          # The dashboard is a long-running server with no --version/--help flag;
          # it loads config and serves. We therefore verify the installed file is
          # a valid Go binary with the version symbol embedded, without starting
          # the server (which would block and need a full NATS/Agamemnon env).
          go version -m "$BIN" | head -5
          echo "OK: atlas binary installed and is a valid Go executable"

  # release — dry-run release validation on main (NO publish). Real publishing
  # happens on tag pushes in release.yml. This emits the canonical `release`
  # check by validating the version + changelog are release-ready.
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release readiness (dry-run, no publish)
        run: |
          set -euo pipefail

          # 1. pixi.toml must carry a parseable workspace/project version —
          #    this is what release.yml asserts against the git tag.
          VERSION="$(python3 - <<'PY'
          import tomllib, sys
          with open("pixi.toml", "rb") as f:
              data = tomllib.load(f)
          section = data.get("workspace") or data.get("project")
          if section is None:
              print("ERROR: pixi.toml has neither [workspace] nor [project]", file=sys.stderr)
              sys.exit(1)
          v = section.get("version")
          if not v:
              print("ERROR: no version in pixi.toml", file=sys.stderr)
              sys.exit(1)
          print(v)
          PY
          )"
          echo "OK: pixi.toml version = ${VERSION}"

          # 2. CHANGELOG must exist and contain an Unreleased section so notes
          #    can be cut at release time.
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md missing"
            exit 1
          fi
          if ! grep -q '## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [Unreleased]' section"
            exit 1
          fi
          echo "OK: CHANGELOG.md present with [Unreleased] section"

          # 3. The release changelog generator must be invocable (dry-run only).
          if [ -f scripts/generate-changelog.sh ]; then
            bash -n scripts/generate-changelog.sh
            echo "OK: generate-changelog.sh parses"
          fi

          echo "release dry-run OK (no artifacts published)"
