name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.67.2
          cache: true

      - name: Install dependencies
        run: pixi install

      - name: Lint all YAML files
        run: |
          pixi run yamllint -d "{extends: default, rules: {line-length: {max: 120}, truthy: disable}}" \
            configs/prometheus.yml \
            configs/loki.yml \
            configs/promtail.yml \
            configs/grafana/datasources.yml \
            configs/grafana/dashboards.yml \
            rules/agent-alerts.yml \
            rules/atlas-alerts.yml \
            docker-compose.yml

      - name: Validate Promtail config syntax
        run: |
          # Run promtail -check-syntax against the committed config inside
          # the same image used by the compose stack. The config references
          # env vars; promtail expands them at parse time when
          # -config.expand-env=true, with missing vars resolving to an empty
          # string — fine for a syntax-only check.
          docker run --rm \
            -v "$PWD/configs/promtail.yml:/etc/promtail/promtail.yml:ro" \
            grafana/promtail:3.1.2 \
            -config.file=/etc/promtail/promtail.yml \
            -config.expand-env=true \
            -check-syntax

      - name: Validate Grafana dashboard JSON
        run: |
          for f in dashboards/*.json; do
            echo "Validating $f ..."
            python3 - "$f" <<'EOF'
          import json, sys
          with open(sys.argv[1]) as fh:
              d = json.load(fh)
          required = {"title", "uid", "panels"}
          missing = required - d.keys()
          if missing:
              print(f"ERROR: {sys.argv[1]} missing fields: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"  OK: uid={d['uid']!r}, title={d['title']!r}, panels={len(d['panels'])}")
          EOF
          done

      - name: Check docker-compose config
        run: docker compose config --quiet
        env:
          GF_ADMIN_PASSWORD: ci-validation-only

      - name: Check .env.example documents every compose variable
        run: bash scripts/check-env-example.sh

      - name: Lint exporter Python
        run: pixi run ruff check exporter/exporter.py

      - name: Security scan exporter Python
        run: |
          # bandit exits non-zero when it finds issues; we want to capture
          # the JSON report unconditionally and let the Python check below
          # decide pass/fail based on severity. Use an explicit exit-code
          # check instead of suppressing all failures with `|| true`.
          set +e
          pixi run bandit -ll -f json exporter/exporter.py > /tmp/bandit.json
          bandit_rc=$?
          set -e
          # bandit exit codes: 0=clean, 1=issues found. Anything else is
          # an unexpected error (e.g. parsing failure) and should fail.
          if [ "$bandit_rc" -ne 0 ] && [ "$bandit_rc" -ne 1 ]; then
              echo "::error::bandit exited with unexpected code $bandit_rc"
              exit "$bandit_rc"
          fi
          python3 << 'SCAN_CHECK'
          import json, sys
          with open('/tmp/bandit.json') as f:
              report = json.load(f)
          high_issues = [r for r in report.get('results', []) if r.get('severity') == 'HIGH']
          if high_issues:
              print(f"FAILURE: Found {len(high_issues)} HIGH severity issues")
              for issue in high_issues:
                  print(f"  {issue.get('issue_text')} at line {issue.get('line_number')}")
              sys.exit(1)
          print("SUCCESS: No HIGH severity security issues found")
          SCAN_CHECK

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

      - name: Assert htpasswd is not tracked
        # Guard against accidental re-addition of nginx basic-auth credentials
        # to the index (see issue #229, follow-up from #101). Matches the
        # canonical path plus any file named `htpasswd` or `*.htpasswd`.
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'configs/nginx/htpasswd' '**/htpasswd' 'htpasswd' '*.htpasswd' '**/*.htpasswd')
          if [ -n "$tracked" ]; then
            echo "::error::htpasswd file(s) found in the git index:"
            echo "$tracked"
            echo "These must not be committed. Remove with: git rm --cached <path>"
            exit 1
          fi
          echo "OK: no htpasswd files tracked"

  unit-tests:
    name: Python unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi install

      - name: Run tests with coverage
        run: pixi run test-unit

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  atlas-dashboard:
    name: Atlas dashboard (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: go build
        working-directory: dashboard
        run: go build ./...

      - name: go vet
        working-directory: dashboard
        run: go vet ./...

      - name: go test (unit, race-detected, coverage)
        working-directory: dashboard
        run: |
          go test -race -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Docker build (verify Dockerfile is buildable)
        working-directory: dashboard
        run: docker build -t argus-dashboard:ci .

  test:
    name: Test exporter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-cov pyyaml

      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check exporter/ tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -ll --skip B310,B202 -r exporter/
