# Dependabot configuration — HomericIntelligence fleet baseline
# Cadence: monthly. Grouping: minor+patch updates in one PR, major-version
# bumps in their own PR for focused review. See the Dependabot options
# reference for details.

version: 2
updates:
  - package-ecosystem: 'docker'
    directory: '/exporter'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: 'chore(docker)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Keep in sync with _MAX_VERSION in tests/test_dockerfile_constraints.py.
      # ">= 3.15" blocks all versions from 3.15 upward AND every higher major
      # (Bundler semver). No separate "4.x" rule needed.
      - dependency-name: "python"
        versions:
          - ">= 3.15"
  - package-ecosystem: 'docker'
    directory: '/jetstream-consumer'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: 'chore(docker)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Keep in sync with _MAX_VERSION in tests/test_dockerfile_constraints.py.
      - dependency-name: "python"
        versions:
          - ">= 3.15"
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: 'chore(ci)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
