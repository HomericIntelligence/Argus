version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/exporter"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "atlas"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "atlas"
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group prometheus client + transitive Prometheus libs into one PR
      # so the metric-stack moves as a unit.
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      # Group nats client + server (test dep) so they stay version-aligned.
      nats:
        patterns:
          - "github.com/nats-io/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    target-branch: "main"
    commit-message:
      prefix: "chore(ci)"
