groups:
  - name: homeric_health
    rules:
      - alert: AgamemnonDown
        expr: hi_agamemnon_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agamemnon is unreachable"
          description: "ProjectAgamemnon /v1/health has been unreachable for 2 minutes."

      - alert: NestorDown
        expr: hi_nestor_health == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Nestor is unreachable"
          description: "ProjectNestor /v1/health has been unreachable for 2 minutes."

      - alert: ExporterScrapeStale
        expr: time() - homeric_exporter_scrape_timestamp_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Homeric exporter scrape is stale"
          description: "No scrape has completed in more than 5 minutes."

      - alert: HighTaskFailureRate
        expr: >
          (
            hi_tasks_by_status{status="failed"}
            /
            (hi_tasks_count + 1e-9)
          ) > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Task failure rate above 20%"
          description: "More than 20% of tasks are in failed state. Value: {{ $value | humanizePercentage }}."

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target is down"
          description: "Target {{ $labels.job }} @ {{ $labels.instance }} unreachable for 3m."

      - alert: HomericExporterDown
        expr: up{job="homeric-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Homeric exporter is down"
          description: "Exporter {{ $labels.instance }} unreachable for 2 minutes."

      - alert: AllAgentsOffline
        expr: hi_agents_online == 0 and hi_agents_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "All agents are offline"
          description: "All {{ $value }} agents in the ecosystem are currently offline."

      - alert: NatsConnectionDrop
        expr: nats_connections == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NATS connections dropped to zero"
          description: "NATS has zero active connections for 2m. Messaging unavailable."

      - alert: NatsSlowConsumers
        expr: nats_slow_consumers > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS slow consumers detected"
          description: "NATS broker detected {{ $value }} slow consumers for 5 minutes. Consumer lag may be increasing."

      - alert: JetstreamConsumerStale
        expr: time() - hi_jetstream_consumer_scrape_timestamp > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "JetStream consumer scrape is stale"
          description: "No scrape from jetstream-consumer in more than 5 minutes."

      - alert: JetstreamConsumerNotConnected
        expr: absent(hi_jetstream_consumer_scrape_timestamp)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "JetStream consumer is not running"
          description: "hi_jetstream_consumer_scrape_timestamp metric is absent."
