networks:
  argus:
    driver: bridge
  loki-internal:
    driver: bridge
    internal: true

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ${PROMETHEUS_CONTAINER_NAME:-argus-prometheus}
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - argus
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"

  loki:
    image: grafana/loki:3.1.2
    container_name: ${LOKI_CONTAINER_NAME:-argus-loki}
    restart: unless-stopped
    expose:
      - "3100"
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./configs/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - loki-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  loki-proxy:
    image: nginx:1.27-alpine
    container_name: argus-loki-proxy
    restart: unless-stopped
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3101:80"
    volumes:
      - ./configs/nginx/loki.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
    networks:
      - argus
      - loki-internal
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"

  promtail:
    image: grafana/promtail:3.1.2
    container_name: ${PROMTAIL_CONTAINER_NAME:-argus-promtail}
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./configs/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - ${NATS_LOG_DIR:-/home/mvillmow/.local/share/nats}:/logs/nats:ro
      - /tmp/hermes.log:/logs/hermes.log:ro
    environment:
      HOSTNAME: ${HOSTNAME}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - argus
      - loki-internal
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: argus-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - argus
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ${GRAFANA_CONTAINER_NAME:-argus-grafana}
    restart: unless-stopped
    user: "472:472"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./configs/grafana:/etc/grafana/provisioning:ro
      - ./configs/grafana/alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - argus
    depends_on:
      - prometheus
      - loki-proxy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  argus-exporter:
    image: python:3.11-slim
    container_name: ${EXPORTER_CONTAINER_NAME:-argus-exporter}
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "9100"
    ports:
      - "127.0.0.1:${EXPORTER_PORT:-9100}:9100"
    volumes:
      - ./exporter/exporter.py:/exporter.py:ro
    command: python /exporter.py
    environment:
      AGAMEMNON_URL: ${AGAMEMNON_URL:-http://172.20.0.1:8080}
      NESTOR_URL: ${NESTOR_URL:-http://172.20.0.1:8081}
      NATS_URL: ${NATS_URL:-http://172.24.0.1:8222}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - argus
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"

  argus-dashboard:
    image: ghcr.io/homericintelligence/atlas:v0.2.0
    container_name: argus-dashboard
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      ATLAS_LISTEN_ADDR: ":3002"
      ATLAS_AGAMEMNON_URL: ${AGAMEMNON_URL:-http://172.20.0.1:8080}
      ATLAS_NESTOR_URL: ${NESTOR_URL:-http://172.20.0.1:8081}
      ATLAS_NATS_MON_URL: ${NATS_URL:-http://172.24.0.1:8222}
      ATLAS_GRAFANA_URL: "http://argus-grafana:3000"
      ATLAS_LOKI_URL: "http://argus-loki-proxy:80"
      ATLAS_PROMETHEUS_URL: "http://argus-prometheus:9090"
      # Atlas defaults to bearer auth and refuses to start without
      # ATLAS_AUTH_BEARER_TOKEN. Operators who genuinely need an
      # unauthenticated dashboard (single-host dev, fully isolated
      # network) must set ATLAS_AUTH_MODE=none explicitly in their .env.
      ATLAS_AUTH_MODE: ${ATLAS_AUTH_MODE:-bearer}
      ATLAS_AUTH_BEARER_TOKEN: ${ATLAS_AUTH_BEARER_TOKEN:-}
    # No container-level healthcheck: the Atlas image is built on
    # gcr.io/distroless/static-debian12:nonroot which has no shell,
    # no wget, no curl, and no busybox to invoke. Operators should rely
    # on Docker's process-up signal plus external HTTP probes against
    # http://<host>:3002/livez (always 200 if the process is up) for
    # liveness and /readyz (200 only when every component is loaded,
    # enabled, and reporting valid results without error) for readiness.
    networks:
      - argus
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # dev-only: interactive debug shell for exec-based troubleshooting
  # Start with: docker compose --profile dev up -d debug-shell
  debug-shell:
    image: python:3.11.10-slim
    container_name: argus-debug-shell
    profiles: [dev]
    command: sleep infinity
    networks:
      - argus

  jetstream-consumer:
    image: python:3.11-slim
    container_name: argus-jetstream-consumer
    restart: unless-stopped
    ports:
      - "9101:9101"
    volumes:
      - ./jetstream-consumer/consumer.py:/consumer.py:ro
    command: sh -c "pip install nats-py -q && python /consumer.py"
    environment:
      NATS_URL: "nats://172.24.0.1:4222"
      EXPORTER_PORT: "9101"
    networks:
      - argus

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alertmanager_data:
  promtail_positions:
